server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/crm_order
    username: ${ORDER_DB_USER:crm_order}
    password: ${ORDER_DB_PASSWORD:crm_order}
  # Faz 25: FR-017 sepeti Redis'te yaşar (basket:sale:{orderId}).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# T12: gateway onek soymaz; api-docs gateway uzerinden erisilebilsin diye onekli sunulur
# (merkezi Swagger UI dropdowni /order/v3/api-docs cagirir).
springdoc:
  api-docs:
    path: /order/v3/api-docs

management:
  # NOT: management.server.port ortak config'tedir (common/application.yml — T24 Faz E.5).
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis

# FR-022 ACC-4 / sepet TTL'i (Faz 25): bekleyen satış zaman aşımı — parametrik.
crm:
  sale:
    timeout: 72h
    # FR-022 ACC-4: zaman aşımı tarama sıklığı (job ShedLock'lu — tek instance koşar).
    # e2e senaryo 6'da kısa timeout ile birlikte düşürülür.
    timeout-scan:
      interval-ms: 60000
  # FR-021 submit in-flight kilidi TTL'i (ACC-13/14): çökme sonrası kilit takılmasın.
  submit:
    lock-ttl: 60s
  # FR-021 orta katman entegrasyonu. Simülatör modu e2e senaryolarını sürer:
  # success | error | timeout (T24 §3.1 — yenilenebilir, restart gerektirmez).
  # reconcile.interval-ms: SBMT_UNVRF mutabakat job'ının tetikleme aralığı; @Scheduled kaydında
  # okunur, refresh ile DEĞİŞMEZ (T24 §3.2).
  #
  # A10 (2026-07-24): buradan `timeout: 30s` ve `reconcile.attempts: 3` KALDIRILDI — hiçbir kod
  # bu iki anahtarı okumuyordu (placeholder yoktu), yani parametrik oldukları izlenimi
  # yanıltıcıydı. Orta katman deadline'ı ve deneme üst sınırı gerçekten uygulanacaksa önce kodda
  # bağlanmalı, sonra buraya geri eklenmelidir.
  middleware:
    mode: success
    reconcile:
      interval-ms: 15000
