server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/crm_catalog
    username: ${CATALOG_DB_USER:crm_catalog}
    password: ${CATALOG_DB_PASSWORD:crm_catalog}

# T12: gateway onek soymaz; api-docs gateway uzerinden erisilebilsin diye onekli sunulur
# (merkezi Swagger UI dropdowni /catalog/v3/api-docs cagirir).
springdoc:
  api-docs:
    path: /catalog/v3/api-docs

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
