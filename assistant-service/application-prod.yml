# Production profili.
#
# Faz 0 karari 2'nin koda yazilmis hali: gercek musteri verisiyle calisan ortamda asistan
# KAPALIDIR. Acmak ayri ve bilincli bir karardir - musteri verisinin model saglayicisina
# gitmesi KVKK kapsaminda yurt disina aktarimdir.
#
# Kapaliyken servis AYAKTA kalir, yalniz yetenekleri kapalidir:
#   GET  /assistant/api/v1/ping          -> 200, data.enabled = "false"
#   POST /assistant/api/v1/conversations -> 503 ASSISTANT_DISABLED
crm:
  environment: prod
  assistant:
    enabled: false

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
