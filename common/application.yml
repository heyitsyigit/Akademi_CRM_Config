# =====================================================================
# Tüm servislerin ortak yapılandırması (Spring Cloud Config - shared).
# Bu dosya Akademi_CRM_Config Git deposunun ortak yapılandırmasıdır.
# =====================================================================

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
    # T24 Faz B2 (A12) — ZORUNLU: Eureka client'ını refresh kapsamı DIŞINDA tut.
    # Varsayılan (true) EurekaClientAutoConfiguration'ın RefreshableEurekaClientConfiguration
    # dalını seçer; orada eurekaClient / eurekaApplicationInfoManager / eurekaRegistration
    # bean'lerinin üçü de @RefreshScope'tur. Bu durumda her /actuator/refresh çağrısı:
    #   (1) mevcut kaydı siler (deregister 200),
    #   (2) instance-id ${random.uuid} yeniden çözüldüğü için YENİ kimlikle kaydolmaya çalışır,
    #   (3) bu kayıt "Cannot execute request on any known server" ile düşer
    # → servis Eureka'dan tamamen çıkar ve kendiliğinden toparlanmaz (yalnız restart düzeltir).
    # false → refresh kapsamsız EurekaClientConfiguration dalı seçilir, kayıt refresh'ten etkilenmez.
    # Yan etkisi ("hiçbir eureka.* özelliği refresh'lenemez") T24 §3.2'deki kararla zaten aynıdır:
    # eureka.* restart gerektiren anahtarlar sınıfındadır.
    refresh:
      enable: false
  instance:
    prefer-ip-address: true
    # T20 (b): her instance benzersiz kayıt olur (yatay ölçekleme).
    #
    # A14 (2026-07-24) — ${random.uuid} DEĞİL, konteyner kimliği kullanılır.
    # random.uuid her AÇILIŞTA yeni değer üretiyordu: servis restart edilince Eureka'ya YENİ
    # kimlikle kaydoluyor, eski kayıt onun yerine geçmediği için ölü instance olarak kalıyordu.
    # Toplu restart sonrası yenileme oranı düşünce self-preservation tahliyeyi de durduruyor ve
    # gateway round-robin ile ölü IP'ye gidip NoRouteToHostException/500 üretiyordu (canlı yaşandı).
    # spring.cloud.client.hostname konteyner kimliğidir: --scale altında replika başına
    # BENZERSİZ (T20'nin amacı korunur) ama restart'ta AYNI kalır, böylece Eureka kaydı değiştirir.
    # ${HOSTNAME} kullanılamaz: bu imajlarda HOSTNAME env değişkeni tanımlı değildir (doğrulandı).
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}

spring:
  # T1: virtual threads.
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # T3: şema Flyway ile yönetilir; Hibernate yalnızca doğrular.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  # T22: i18n mesaj kaynakları (common-lib messages_tr/messages_en).
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # T18/T20: Kafka tüketicileri (yayın Debezium ile; servisler producer kullanmaz).
  # group-id = servis adı → partition'lar instance'lara dağılır (3 partition).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  # T24 Faz E.5 — actuator İŞ PORTUNDAN AYRI bir portta sunulur.
  # Konteyner başına tek uygulama olduğu için tüm servislerde aynı port kullanılabilir.
  # Bu port compose'da host'a PUBLISH EDİLMEZ → actuator dış ağdan hiç erişilemez; yalnız
  # compose ağından (Prometheus scrape) ve `podman exec` ile (refresh-all.sh) ulaşılır.
  # A17'nin üzerine savunma derinliğidir: orada gateway'in actuator'ü ADMIN token'a bağlanmıştı,
  # burada iş portundan tamamen kaldırılıyor.
  # Etkilenen yerler: compose healthcheck'leri + connector-init READINESS_URLS,
  # infra/monitoring/prometheus.yml hedefleri, infra/config/refresh-all.sh, startup smoke.
  # Kapsam: yalnız config CLIENT'ları (8 domain + gateway). config-server ve discovery-server
  # kendi ayarlarını bu dosyadan okumaz ve yazma ucu sunmaz — bilinçli olarak kapsam dışı.
  server:
    port: 9000
  endpoints:
    web:
      # T24: 'refresh' ucu Config Server'dan gelen değerleri çalışan uygulamaya restart'sız
      # uygular (@ConfigurationProperties bean'leri yerinde yeniden bağlanır).
      # PROD'A AÇIK DEĞİLDİR: her servisin application-prod.yml'ı bu listeyi tümüyle ezip
      # 'health,info,prometheus' verir → refresh prod'da otomatik kapalıdır (fail-closed).
      # Prod'da kimlik doğrulamalı açılması T24 Faz E'nin işidir.
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Merkezi Swagger UI tarayıcıda çalıştığı için container IP'lerine değil gateway origin'ine gider.
# OAuth URL'leri de tarayıcının erişebildiği host Keycloak adresleridir.
swagger:
  gateway-server-url: ${SWAGGER_GATEWAY_SERVER_URL:/}
  oauth2:
    authorization-url: ${SWAGGER_OAUTH2_AUTHORIZATION_URL:http://localhost:8090/realms/crm-lite/protocol/openid-connect/auth}
    token-url: ${SWAGGER_OAUTH2_TOKEN_URL:http://localhost:8090/realms/crm-lite/protocol/openid-connect/token}

# GK-004 (D-4): ülke kodu seçilmeyen telefon girdileri bu kodla E.164'e tamamlanır (parametrik).
crm:
  phone:
    default-dial-code: "+900"
