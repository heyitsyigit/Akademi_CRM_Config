server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/crm_party
    username: ${PARTY_DB_USER:crm_party}
    password: ${PARTY_DB_PASSWORD:crm_party}

# T12: gateway onek soymaz; api-docs gateway uzerinden erisilebilsin diye onekli sunulur
# (merkezi Swagger UI dropdowni /party/v3/api-docs cagirir).
springdoc:
  api-docs:
    path: /party/v3/api-docs

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
