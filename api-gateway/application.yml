server:
  port: 8080

# FR-001: Keycloak JWT doğrulama uçları.
# issuer-uri = token'daki iss (host'tan alınan token: localhost:8090).
# jwk-set-uri = anahtarların çekileceği URL (konteynerde keycloak:8080'e override edilir).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/crm-lite}
  jwk-set-uri: ${KEYCLOAK_JWKSET_URI:http://localhost:8090/realms/crm-lite/protocol/openid-connect/certs}
  # FR-023 ACC-7: dil tercihi Keycloak Account API'si üzerinden kullanıcının kendi
  # token'ıyla yazılır. jwk-set-uri gibi konteyner içi adrese override edilir.
  account-uri: ${KEYCLOAK_ACCOUNT_URI:http://localhost:8090/realms/crm-lite/account}
  # FR-001: giriş (direct access grant) artık FE'den değil gateway'den yapılır — kilitli
  # hesap ile yanlış parola ayrımı (ACC-8) yalnız sunucu tarafında kurulabilir.
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8090/realms/crm-lite/protocol/openid-connect/token}
  # ACC-8: kilit durumu Admin API'nin attack-detection ucundan okunur.
  admin-uri: ${KEYCLOAK_ADMIN_URI:http://localhost:8090/admin/realms/crm-lite}
  # Girişin yapıldığı public client: FE'nin bugüne kadar kullandığının AYNISI — üretilen
  # token'ın azp/aud değerleri değişmez, resource-server kuralları aynen geçerli kalır.
  login-client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:crm-web}
  # ACC-8 kilit sorgusunun kimliği. Yetkisi TEK role sınırlıdır: realm-management:view-users.
  # Yer tutucu adları property adlarının gevşek-bağlama (relaxed binding) karşılığıdır:
  # KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET ortam değişkeni bu depo güncellenmemiş olsa da
  # doğrudan keycloak.service-account.client-secret'a bağlanır (compose ile Config deposu
  # arasında sürüm farkı oluştuğunda gateway yine ayağa kalkar).
  service-account:
    client-id: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_ID:crm-gateway}
    client-secret: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET:crm-gateway-secret}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          # Route'lar Eureka üzerinden load-balanced (lb://) çözümlenir.
          # JWT resource-server doğrulaması Faz 1'de (Keycloak) eklenecektir.
          routes:
            - id: party-service
              uri: lb://party-service
              predicates:
                - Path=/party/**
            # ── T32 Faz 4 DEVİR (K-8 strangler) ──────────────────────────────────
            # FR-002 müşteri araması artık aggregation-service'in Elasticsearch okuma
            # modelinden (OM-1) cevaplanır. DIŞ UÇ YOLU DEĞİŞMEZ: frontend hâlâ
            # /customer/api/v1/customers/search çağırır (api-paths.ts'teki GATEWAY_URL_PATTERN
            # regex'i de dokunulmadan kalır) — devir FE'ye görünmezdir.
            #
            # SIRA ÖNEMLİDİR: bu route customer-service'in /customer/** route'undan ÖNCE
            # gelmelidir, yoksa genel route aramayı da yutar. Liste sırasına ek olarak
            # `order: -1` ile açıkça öne alındı (liste yeniden düzenlenirse de bozulmaz).
            #
            # RewritePath NEDEN GEREKLİ: aggregation-service kendi kanonik önekini sunar
            # (/aggregation/api/v1/... — CLAUDE.md "yol öneki = servis adı" kuralı). Yol
            # olduğu gibi iletilseydi servis 404 dönerdi. Rewrite sayesinde devir TAMAMEN
            # konfigürasyondur: servis kodunda yabancı bir yol öneki taşınmaz ve Faz 5
            # temizliği yalnız bu bloğun silinmesidir (deploy yok).
            #
            # GERİ DÖNÜŞ: bu route'u sil + busrefresh → arama saniyeler içinde
            # customer-service'e döner. customer-service'teki arama kodu Faz 5'e kadar DURUR.
            - id: customer-search-compat
              uri: lb://aggregation-service
              order: -1
              predicates:
                - Path=/customer/api/v1/customers/search
                - Method=GET
              filters:
                - RewritePath=/customer/api/v1/customers/search,/aggregation/api/v1/customers/search
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customer/**
            - id: address-service
              uri: lb://address-service
              predicates:
                - Path=/address/**
            - id: contact-service
              uri: lb://contact-service
              predicates:
                - Path=/contact/**
            # Faz 23 (FR-016…018): katalog, sipariş ve iş etkileşimi servisleri.
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/catalog/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
            - id: interaction-service
              uri: lb://interaction-service
              predicates:
                - Path=/interaction/**
            # Faz 22 rezervinin gerçekleşmesi (Faz 28): FE ürün detayını (FR-015)
            # customer-service proxy'si olmadan doğrudan bu route'tan alır.
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**
            # T31: CRM Asistani. Domain servisi DEGILDIR ama erisim yine gateway
            # uzerindendir - asistanin kendi arac cagrilari da BU route'a geri doner
            # ve kullanicinin kendi JWT'siyle gelir, boylece /internal/** yasagi ile
            # rol kontrolu asistan icin de gecerli olur.
            #
            # NOT: cevap uclari SSE'dir (text/event-stream). Akisin parca parca gecmesi
            # beklenir; tek parca geliyorsa gateway tamponluyordur ve ayrica ele alinir.
            - id: assistant-service
              uri: lb://assistant-service
              predicates:
                - Path=/assistant/**
            # T32 Faz 1: CQRS okuma tarafı (kanonik yol — K-1). Faz 4'te uyumluluk route'u
            # eklendi (yukarıdaki customer-search-compat); kanonik yol da açık kalır —
            # yeni istemciler doğrudan buraya gelmelidir, Faz 5'te FE bu yola geçirilecek.
            - id: aggregation-service
              uri: lb://aggregation-service
              predicates:
                - Path=/aggregation/**

# T12: merkezi Swagger UI (http://localhost:8080/swagger-ui.html) — dropdown'daki her giriş,
# ilgili servisin ÖNEKLİ api-docs ucuna gateway route'u üzerinden gider (ör. /party/v3/api-docs).
# Servis tarafındaki önek, config-repo/<servis>.yml'deki springdoc.api-docs.path override'ıdır.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    oauth:
      client-id: crm-web
      scopes: openid,profile
      use-pkce-with-authorization-code-grant: true
    urls:
      - name: party-service
        url: /party/v3/api-docs
      - name: customer-service
        url: /customer/v3/api-docs
      - name: address-service
        url: /address/v3/api-docs
      - name: contact-service
        url: /contact/v3/api-docs
      - name: catalog-service
        url: /catalog/v3/api-docs
      - name: order-service
        url: /order/v3/api-docs
      - name: interaction-service
        url: /interaction/v3/api-docs
      - name: product-service
        url: /product/v3/api-docs
      - name: assistant-service
        url: /assistant/v3/api-docs
      - name: aggregation-service
        url: /aggregation/v3/api-docs
